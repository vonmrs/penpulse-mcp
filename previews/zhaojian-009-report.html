<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>模板参考</title>
</head>
<body>
<!-- 封面区 -->
<section style="padding: 0; background: #eceff1;">
  <section style="padding: 48px 28px 40px; text-align: center; background: linear-gradient(135deg, #37474f 0%, #607d8b 100%);">
    <p style="font-size: 11px; color: rgba(255,255,255,0.7); letter-spacing: 3px; margin: 0 0 16px; text-transform: uppercase;">行业 · 报告</p>
    <h1 style="font-size: 26px; font-weight: 900; color: #ffffff; line-height: 1.3; margin: 0 0 16px;">2026荆州出租车行业半年度报告</h1>
    <p style="font-size: 15px; color: rgba(255,255,255,0.85); margin: 0;">整合前夕的荆州出租车行业：数据透视与趋势研判</p>
  </section>
</section>
<!-- 正文区 -->
<section style="padding: 24px 20px 32px; background: #eceff1;">
  <!-- 核心数字 -->
  <section style="display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;">
    <section style="flex: 1; min-width: 120px; background: #ffffff; border-radius: 8px; padding: 16px; text-align: center;">
      <p style="font-size: 28px; font-weight: 900; color: #37474f; margin: 0 0 4px;">11家</p>
      <p style="font-size: 12px; color: #888; margin: 0;">现有运营公司</p>
    </section>
    <section style="flex: 1; min-width: 120px; background: #ffffff; border-radius: 8px; padding: 16px; text-align: center;">
      <p style="font-size: 28px; font-weight: 900; color: #37474f; margin: 0 0 4px;">1988辆</p>
      <p style="font-size: 12px; color: #888; margin: 0;">主城区运力总量</p>
    </section>
    <section style="flex: 1; min-width: 120px; background: #ffffff; border-radius: 8px; padding: 16px; text-align: center;">
      <p style="font-size: 28px; font-weight: 900; color: #37474f; margin: 0 0 4px;">-23%</p>
      <p style="font-size: 12px; color: #888; margin: 0;">近5年营收变化</p>
    </section>
  </section>
  <!-- 核心发现 -->
  <section style="background: #ffffff; border-radius: 8px; padding: 18px 20px; margin-bottom: 20px;">
    <p style="font-size: 13px; color: #37474f; font-weight: 700; letter-spacing: 2px; margin: 0 0 12px; text-transform: uppercase;">核心发现</p>
    <p style="font-size: 15px; color: #263238; line-height: 1.8; margin: 0 0 12px;">① 网约车冲击持续，巡游出租车日均接单量近三年下降约两成；</p>
    <p style="font-size: 15px; color: #263238; line-height: 1.8; margin: 0 0 12px;">② 分散经营导致各公司利润摊薄，无力投入品牌建设；</p>
    <p style="font-size: 15px; color: #263238; line-height: 1.8; margin: 0;">③ 整合是市场规律使然，政策推动只是顺势而为。</p>
  </section>
  <!-- 结论 -->
  <section style="background: #37474f; border-radius: 8px; padding: 18px 20px; margin-bottom: 20px;">
    <p style="font-size: 11px; color: rgba(255,255,255,0.6); letter-spacing: 2px; margin: 0 0 10px; text-transform: uppercase;">结论</p>
    <p style="font-size: 16px; font-weight: 600; color: #ffffff; line-height: 1.6; margin: 0;">整合不是终点，是荆州出租车走向品牌化、标准化的起点。</p>
  </section>
</section>
</body>
</html>
